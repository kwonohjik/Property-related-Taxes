name: Supabase Keepalive

# Supabase 무료 플랜은 약 7일간 활동이 없으면 프로젝트를 자동 일시정지(pause)한다.
# pause되면 서브도메인 DNS가 끊겨(NXDOMAIN) 양도세 세율(tax_rates) 로드가 실패한다.
#   → 본 워크플로가 3일마다 가벼운 쿼리를 보내 활동 상태를 유지한다.
#   → (이중 안전장치) 그래도 pause되면 lib/db/tax-rates.ts loadFallbackTransferRates()가
#     로컬 세율로 계산을 이어가므로 앱은 멈추지 않는다.
#
# 사전 설정 (1회 — repo Settings → Secrets and variables → Actions → New repository secret):
#   - NEXT_PUBLIC_SUPABASE_URL       (예: https://xxxx.supabase.co)
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY  (anon public key — tax_rates_select RLS로 읽기 허용됨)
#   설정 전에는 워크플로가 secret 부재를 감지해 graceful skip (실패 아님).

on:
  schedule:
    # 3일마다 00:17 UTC (정시 혼잡 회피용 오프셋). cron: 분 시 일 월 요일
    - cron: "17 0 */3 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 트리거 사유"
        required: false
        default: "manual"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (tax_rates 1행 조회)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Supabase secrets 미설정 — keepalive skip (앱은 로컬 세율 fallback으로 동작)"
            exit 0
          fi

          # REST API로 tax_rates 1행만 조회 (가장 가벼운 활동 신호)
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/tax_rates?select=tax_type&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase REST 응답: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::notice::Supabase 활성 유지 OK (HTTP 200)"
          else
            # pause/오류여도 워크플로 자체는 성공 처리 — 다음 실행에서 재시도.
            # (curl 한 번으로 깨우지 못해도 fallback이 앱을 보호하므로 fail로 알람 띄우지 않음)
            echo "::warning::Supabase ping 비정상 (HTTP $code) — pause되었을 수 있음. fallback이 앱을 보호하며 다음 cron에서 재시도."
          fi
