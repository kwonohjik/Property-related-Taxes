name: CI

# ══════════════════════════════════════════════════════════════════
# Actions 사용량 최소화 설계 (2026-07-31)
#
# 무료 계정 + **비공개 저장소**는 월 2,000분이다. 종전 설정은 그 한도를 상시 초과했다:
#
#   · `push`와 `pull_request`를 **둘 다** 트리거해 변경 1건당 **2회** 실행
#   · 성공 실행 1회가 **10.4~14.4분**(2026-07 실측 8건, 평균 ≈11.8분)
#   → 변경 1건 ≈ 24분 → 한 달에 **약 83건**이면 소진. 2026-07-30 하루에만 9건 머지(≈216분).
#
# 게다가 이 저장소에서 **CI는 머지를 차단하지 않는다**(master에 브랜치 보호 없음 —
# 루트 CLAUDE.md "진짜 게이트는 git push 시 pre-push뿐"). 즉 종전 CI는 pre-push가 이미
# 로컬에서 통과시킨 `tsc + 전체 test`를 **그대로 한 번 더** 돌리는 순수 중복이었다.
#
# ## 그래서 남긴 것 — CI만이 주는 신호
#
#   · **lint**: pre-push는 tsc+test만 돌린다(lint 제외). lint-staged는 **변경 파일만**
#     `--fix`하므로 전체 lint는 CI가 유일한 관문이다. ← 가장 큰 고유 가치
#   · **fresh `npm ci`**: lockfile·의존성 문제는 로컬 node_modules로는 드러나지 않는다.
#   · `--no-verify` 푸시나 훅 없는 환경에서의 우회 감지.
#
# ## 절감 수단
#
#   1. `push` 트리거 제거 → 변경당 2회 → **1회** (-50%)
#   2. 문서·메모리 전용 변경은 워크플로 자체 미실행 (`paths-ignore`)
#   3. draft PR 미실행 — 준비 중 푸시마다 과금되지 않게
#   4. 테스트 범위를 `scripts/select-test-scope.sh`로 판정(pre-push와 **같은 정본**,
#      회귀 테스트 14케이스로 보증). 문서만이면 생략, 한 세목이면 그 세목만.
#   5. `node_modules` 캐시로 `npm ci` 재설치 회피
#
# 한도를 아예 없애려면 저장소를 **공개**로 전환하면 된다(공개 저장소는 Actions 무제한).
# ══════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"

# 같은 PR에 연속 푸시하면 이전 실행을 취소한다 — 중간 커밋에 과금하지 않는다.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test
    # draft PR은 돌리지 않는다 — "Ready for review" 시점부터 과금.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 종전 15분. 실측 성공 최대 14.4분은 **전체 테스트** 기준이고, 이제 범위 판정이
    # 붙으므로 초과 시 조기 중단해 폭주 과금을 막는다.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `setup-node`의 `cache: npm`은 **~/.npm 다운로드 캐시**만 복원한다 — `npm ci`는
      # 여전히 node_modules를 지우고 재설치한다. lockfile 해시로 node_modules 자체를
      # 캐싱해 그 재설치를 건너뛴다.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # 변경 경로로 테스트 범위 판정 — pre-push와 **같은 스크립트**를 쓴다(dual-truth 방지).
      # PR 변경 파일은 API로 받는다: `fetch-depth: 0` 전체 클론(.git 48M)을 피하면서 정확하다.
      - name: Determine test scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            -q '.[].filename' > /tmp/changed.txt
          # 판정 실패 시 안전측 기본값 "test"(전체) — 스크립트 설계 원칙과 동일.
          SCOPE="$(scripts/select-test-scope.sh --stdin < /tmp/changed.txt || echo test)"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "판정된 테스트 범위: $SCOPE"

      - name: Type check
        run: npm run typecheck

      # CI 고유 신호 — pre-push가 돌리지 않는 전체 lint.
      - name: Lint
        run: npm run lint

      # `none`(문서·E2E spec만) 이면 생략. 그 외는 스크립트 출력이 곧 npm 스크립트명이다
      # (`test` → 전체 / `test:transfer` 등 → 세목 단위).
      # `run:`에 `${{ }}`를 직접 넣지 않고 env로 넘긴다 — 표현식이 셸 소스에 전개되는
      # 패턴은 값이 신뢰 경계를 넘는 순간 주입이 된다(여기선 자체 스크립트 출력이지만
      # 형태 자체를 남기지 않는다).
      - name: Test
        if: steps.scope.outputs.scope != 'none'
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: npm run "$SCOPE"
