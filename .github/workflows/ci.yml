name: CI

# ══════════════════════════════════════════════════════════════════
# **self-hosted 러너**에서 실행한다 (2026-07-31).
#
# ## 배경 — GitHub 호스팅은 무료 한도를 상시 초과했다
#
# 무료 계정 + 비공개 저장소는 월 2,000분이다. 종전 설정은:
#   · `push`와 `pull_request`를 **둘 다** 트리거해 변경 1건당 **2회** 실행
#   · 성공 실행 1회가 **10.4~14.4분**(2026-07 실측 8건)
#   → 변경 1건 ≈24분 → 약 83건이면 소진(2026-07-30 하루 9건 머지 ≈216분).
# 소진 후 실행은 3~13초 만에 거부된다("spending limit needs to be increased") —
# 과금은 없지만 **신호도 없다**. 7월 실패 723건이 대부분 이것이다.
#
# ## 해결 — 개발자 Mac을 러너로 등록
#
# GitHub은 **self-hosted 실행에 Actions 분을 과금하지 않는다**. 워크플로·PR 체크 표시는
# 그대로 두고 실행만 로컬로 옮겼다. 비공개 저장소이므로 fork PR이 임의 코드를 실행하는
# self-hosted의 대표 위험도 해당하지 않는다.
#
#   러너 관리: ~/actions-runner/svc.sh {status|stop|start}
#   러너가 꺼져 있으면 체크는 **큐에 대기**한다(실패 아님).
#
# ## 역할 분담 — pre-push와 중복되지 않게
#
#   · **pre-push**(매 푸시, 빠름): 폰트·톤 + typecheck + lint + **범위 선택** 테스트
#     → `scripts/select-test-scope.sh`로 변경 경로에 맞는 세목만
#   · **CI**(PR 1회, 철저): fresh checkout + `npm ci` + typecheck + lint + **전체** 테스트
#     → 러너가 실행마다 `_work/` 아래 독립 디렉터리를 쓰므로 로컬 node_modules가
#       가리던 lockfile·의존성 문제가 드러난다. 로컬 pre-push가 못 주는 신호가 이것뿐이라
#       CI는 **전체 테스트**를 돌린다(범위를 좁히면 pre-push의 재탕이 된다).
#
# 분 과금이 없으므로 종전의 범위 축소·캐시 최적화는 제거했다 — 남기면 이득 없는 복잡도다.
# 대신 문서 전용·draft PR은 여전히 건너뛴다(개발 머신 부하·대기시간).
# ══════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"

# 같은 PR에 연속 푸시하면 이전 실행을 취소한다 — 러너를 한 번에 하나만 점유.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test
    if: github.event.pull_request.draft == false
    runs-on: self-hosted
    # 로컬 실측: npm ci ≈40초 + typecheck ≈30초 + lint ≈26초 + 전체 test ≈165초 ≈ 4~5분.
    # 초과 시 러너가 물리지 않도록 조기 중단.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `setup-node`는 쓰지 않는다 — self-hosted 러너에는 이미 Node가 있고,
      # `cache: npm`은 GitHub 서버로 왕복해 로컬 실행에서는 오히려 느리다.
      # 버전이 어긋나면 여기서 드러나도록 먼저 찍는다.
      - name: Node 버전 확인
        run: node -v && npm -v

      # `npm ci`는 node_modules를 지우고 lockfile 그대로 재설치한다 —
      # 로컬 개발 트리가 가리던 의존성·lockfile 문제를 드러내는 CI 고유 신호다.
      - name: Install deps (fresh)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # pre-push는 범위 선택 테스트만 돌린다 → CI는 전체를 돌려 그 갭을 메운다.
      - name: Test (전체)
        run: npm test
