name: CI

# ══════════════════════════════════════════════════════════════════
# **GitHub 호스팅 러너**에서 실행한다 (2026-08-04 환원).
#
# ## 왜 돌아왔나 — 저장소가 public이 되어 전제가 뒤집혔다
#
# 2026-07-31에 self-hosted(개발자 Mac)로 옮긴 이유는 **비공개 저장소**의 무료 한도였다:
# 월 2,000분인데 변경 1건당 2회 × 10.4~14.4분이라 약 83건이면 소진했고, 소진 후에는
# 3~13초 만에 거부되어 과금도 신호도 없는 상태가 됐다(7월 실패 723건).
#
# 저장소가 public으로 전환되면서 두 가지가 동시에 바뀌었다:
#   1. **GitHub 호스팅 러너가 무료**다(public 저장소는 Actions 분을 쓰지 않는다) — 한도 문제 소멸.
#   2. **self-hosted가 오히려 위험**하다 — public에서는 fork PR이 개발자 Mac에서 임의 코드를
#      실행할 수 있다. GitHub이 명시적으로 권장하지 않는 조합이다.
#
# ⚠️ 저장소를 다시 비공개로 되돌리면 1번 근거가 사라진다. 그때는 사용량을 먼저 확인할 것.
#
# 부수 효과: Mac 전원과 무관하게 CI가 돈다(종전에는 러너가 꺼져 있으면 체크가 큐에 대기했다).
#
# ## 🔴 호스팅 러너는 Mac보다 훨씬 느리다 — job을 쪼개고 E2E를 샤딩하는 이유
#
# 환원 직후의 단일 job 구성은 **호스팅 러너에서 한 번도 완주하지 못했다**(3전 3패, 전부
# 타임아웃 취소 — PR #1056·#1058·#1059). 실측 분해(run 30962559594):
#
#   | 단계                    | 호스팅(ubuntu-latest) | self-hosted(Mac) |
#   |-------------------------|----------------------|------------------|
#   | npm ci·typecheck·lint   | 2.5분                | ~1.5분           |
#   | npm test (vitest)       | **18.7분**           | 3.1분            |
#   | E2E 894건               | **~29분**(2 worker)  | ~5분(5 worker)   |
#   | 합계                    | **~50분**            | 9~10분           |
#
# 원인은 코어 수다 — 호스팅 러너는 2 worker, Mac은 5 worker로 잡힌다. vitest·Playwright
# 둘 다 코어 수에 비례해 병렬도를 정하므로 그대로 몇 배가 된다.
#
# ⚠️ **"실측 10분"은 Mac 수치였다.** #1059가 그 값을 호스팅 실측으로 오인해 타임아웃을
#    25분으로 줄였고, 결과는 더 일찍 죽은 것뿐이었다. 아래 timeout은 **호스팅 러너
#    실측**으로만 갱신할 것 — 러너가 다르면 다른 숫자다.
#
# ⇒ 대응: **check(vitest)와 e2e를 별도 job으로 분리**해 벽시계를 병렬화하고,
#    가장 큰 덩어리인 E2E를 **4샤드**로 나눈다. 두 job은 서로 기다리지 않는다
#    (`needs` 없음) — public 저장소는 Actions 분이 무료라 벽시계가 유일한 비용이다.
#
# ## 역할 분담 — pre-push와 중복되지 않게
#
#   · **pre-push**(매 푸시, 빠름): 폰트·톤 + typecheck + lint + **범위 선택** 테스트
#     → `scripts/select-test-scope.sh`로 변경 경로에 맞는 세목만
#   · **CI**(PR 1회, 철저): fresh checkout + `npm ci` + typecheck + lint + **전체** 테스트 + E2E
#     → 러너가 매번 깨끗한 환경이라 로컬 node_modules가 가리던 lockfile·의존성 문제가
#       드러난다. 로컬 pre-push가 못 주는 신호가 이것이라 CI는 **전체 테스트**를 돌린다
#       (범위를 좁히면 pre-push의 재탕이 된다).
#
# 문서 전용·draft PR은 건너뛴다(대기시간).
# ══════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"

# 같은 PR에 연속 푸시하면 이전 실행을 취소한다 — 낡은 커밋의 결과를 기다리지 않는다.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── job 1: 타입 · 린트 · 단위 테스트 ────────────────────────────────────
  check:
    name: typecheck + lint + test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 호스팅 러너 실측(run 30962559594): npm ci·typecheck·lint 2.5분 + vitest 18.7분 ≈ 21분.
    # 1.5배 여유로 30분. ⚠️ Mac 수치로 조정하지 말 것(위 표).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 개발 환경과 메이저를 맞춘다(로컬 v24). 호스팅 러너 기본 Node는 이보다 낮을 수 있어
      # 명시하지 않으면 로컬에서 통과한 코드가 여기서만 깨질 수 있다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Node 버전 확인
        run: node -v && npm -v

      # `npm ci`는 node_modules를 지우고 lockfile 그대로 재설치한다 —
      # 로컬 개발 트리가 가리던 의존성·lockfile 문제를 드러내는 CI 고유 신호다.
      - name: Install deps (fresh)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # pre-push는 범위 선택 테스트만 돌린다 → CI는 전체를 돌려 그 갭을 메운다.
      - name: Test (전체)
        run: npm test

  # ── job 2: E2E (4샤드 병렬) ─────────────────────────────────────────────
  #
  # **E2E는 종전에 어느 자동 게이트에도 없었다.** pre-push도 CI도 vitest만 돌렸다.
  # 그래서 PR#1008이 `gift-deemed-capital-increase.spec.ts`를 조용히 무력화시킨 것을
  # 다음 작업에서야 발견했다(`toContainText("0")`이 substring이라 "300,000,000"도 통과).
  #
  # pre-push에는 넣지 않는다 — 매 푸시에 붙으면 개발 흐름이 끊긴다. PR 1회만 돌린다.
  #
  # `check`를 기다리지 않는다(`needs` 없음) — 병렬이라야 벽시계가 줄고, public 저장소는
  # Actions 분이 무료라 "typecheck가 깨졌을 때 낭비되는 E2E 분"이 비용이 아니다.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 실측 역산: 894건을 2 worker로 전건 ~29분 → 4샤드면 샤드당 ~7분 + 준비 2분 ≈ 9분.
    # ⚠️ 이 값은 **취소된 실행에서 역산한 추정**이다. 첫 완주 후 실측으로 교체할 것.
    timeout-minutes: 25
    strategy:
      # 한 샤드가 깨져도 나머지를 끝까지 돌린다 — 실패가 한 샤드에 몰렸는지 전반적인지가
      # 원인 판단을 가른다. fail-fast면 그 구분이 사라진다.
      fail-fast: false
      matrix:
        # ⚠️ 샤드 수를 바꾸면 아래 `--shard=N/4`의 분모도 함께 바꿔야 한다.
        #    어긋나면 일부 테스트가 어느 샤드에도 안 들어가 **조용히 실행되지 않는다**.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (fresh)
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # ⚠️ `known-failures 제외` 전제가 이 step을 의미 있게 만든다 — master에도 실패하는
      #    건들을 그대로 두면 CI가 상시 빨간불이 되어 게이트 구실을 못 한다
      #    (`e2e/known-failures.ts`). 목록은 **줄이기만** 한다.
      # ⚠️ 호스팅 러너는 Linux다. Mac 기준으로 쌓인 known-failures와 어긋나 렌더 차이로
      #    새 실패가 나올 수 있다 — 그때는 원인을 확인하고 고친다(목록에 추가하지 말 것).
      #
      # 샤딩은 `grepInvert`(known-failures) **적용 후**의 집합을 나눈다 — 제외 대상이
      # 한 샤드에 몰려 불균형해지지 않는다.
      #
      # `blob` 리포터는 샤드별 부분 결과를 낸다 — 아래 `e2e-report` job이 HTML 하나로 합친다.
      # (config의 html 리포터를 CLI로 덮어쓴다. 샤드마다 별도 HTML을 내면 합칠 수 없다.)
      - name: E2E 샤드 ${{ matrix.shard }}/4 (알려진 사전존재 실패 제외)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,blob
        env:
          # 🔴 법제처 API 의존 spec은 여기서 뺀다 — 아래 `e2e-law` job이 따로 돌린다.
          #    외부 API 가용성 때문에 깨지는 건들이 **우리 코드의 신호를 오염시키지 않게** 격리한다.
          #    (경위·오진 정정은 `e2e-law` 주석 참조.)
          E2E_SKIP_LAW: "1"
          # 🔑 `e2e/law-*.spec.ts`(법령 리서치 12 spec)는 법제처 Open API를 직접 호출한다.
          # `.gitignore`가 `.env*`를 제외하므로 **fresh checkout에는 키가 없고**,
          # `lib/korean-law/client-core.ts:48`의 `process.env.KOREAN_LAW_OC`가 빈 값이 되어
          # 브라우저에 `TypeError: Failed to fetch`가 뜬다.
          #   ⇒ 2026-08-02 E2E 게이트 도입 후 **CI 6연속 실패**가 전부 이 원인이었다.
          #     로컬은 `.env.local`이 있어 통과하므로 "known-failures 0건"도 로컬 기준이었다.
          # 저장소 secret으로 주입한다(2026-08-03 등록). 이 키가 없으면 law spec은 CI에서만 빨간불이다.
          KOREAN_LAW_OC: ${{ secrets.KOREAN_LAW_OC }}

      - name: blob 리포트 업로드
        # 실패해도 올린다 — 실패했을 때가 리포트가 필요한 때다.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # ── job 3: 법제처 API 의존 E2E (샤딩하지 않는다 · 자문 성격) ────────────
  #
  # `law-*.spec.ts` 16파일 **29건**은 법제처 Open API를 실제로 호출한다.
  # 이들만 따로 떼는 이유는 **검증 대상이 우리 코드가 아니라 외부 API 가용성**이기 때문이다.
  #
  # ## 실측 경위 (2026-08-05) — 처음 세운 가설은 틀렸다
  #
  # 4샤드로 나눈 첫 실행(run 30966538330)에서 5건이 30초~1.5분 타임아웃으로 깨졌다:
  # POPUP-1 · HTML-1 · TBL-1 · CITE-1 · IMP-1. 같은 커밋의 **샤딩 전** 실행
  # (run 30962003893)에서는 전부 5~9초에 통과했기에 "샤드 4개가 같은 OC 키를 동시에
  # 두드려서"라고 진단했다. **오진이었다** — 이 job으로 떼어 `--workers=1` 단독으로
  # 돌린 run 30967618223에서도 **같은 5건이 같은 방식으로** 실패했다.
  #
  # 확인된 사실만 적는다:
  #   · 실패하는 5건은 전부 **법제처 조문 본문**이 필요하다.
  #     통과하는 24건은 라우팅·헤더 등 **클라이언트 파생 값만** 단언한다.
  #   · 같은 커밋이 00:41(run 30962003893)에는 통과했고, 01:30 이후로는 계속 실패한다.
  #   · 법제처 API 자체는 같은 시각 **로컬에서 정상**이다(조문 본문 조회 0.9초, http 200).
  #   ⇒ CI 환경에서만, 특정 시점 이후로 본문이 오지 않는다. **근본 원인은 미확정**이다
  #     (러너 IP 대역 스로틀링이 유력하나 확인하지 못했다 — 추정으로 단정하지 말 것).
  #
  # ## 그래서 `continue-on-error`다
  #
  # 이 job은 **머지를 막지 않는다**. 우리가 고칠 수 없는 외부 사유로 상시 빨간불이 되면
  # "실질 관문이 없는 CI"가 되어, 이 저장소가 이미 겪은 실패 모드를 반복한다
  # (lint가 상시 실패 CI에만 있어 아무도 안 보던 시기).
  #
  # ⚠️ **`known-failures.ts`에 넣는 것과는 다르다.** 목록에 넣으면 실행 자체가 사라져
  #    나중에 진짜 회귀가 생겨도 아무도 모른다. 여기서는 **매번 돌고 결과가 보이되**
  #    빨간불이 머지를 막지만 않는다. 나머지 865건은 그대로 **차단 게이트**다.
  # ⚠️ 근본 원인이 밝혀져 안정화되면 `continue-on-error`를 **제거**할 것.
  #    이 플래그는 영구 면제가 아니라 원인 미상 구간의 임시 조치다.
  #
  # ⚠️ 샤딩 job과 이 job의 합이 전건인지 확인할 것:
  #     `CI=1 E2E_SKIP_LAW=1 npx playwright test --list` (865)
  #   + `CI=1 npx playwright test --list law-`            (29) = 894 = 전건
  #   `testIgnore` 패턴(`**/*law-*.spec.ts`)과 아래 positional 필터(`law-`)가 어긋나면
  #   그 spec은 **어느 job에서도 돌지 않는다**(조용한 미실행).
  e2e-law:
    name: E2E (법제처 API · 자문)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 🔴 결과는 보고하되 머지는 막지 않는다 — 위 "그래서 continue-on-error다" 참조.
    continue-on-error: true
    # 실측(run 30967618223): 워커 1개 직렬로 10.6분(실패 5건의 재시도 포함).
    # 전건 통과 시에는 더 짧다. 1.5배 여유로 15분.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (fresh)
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # positional `law-`는 **파일 경로** 정규식이다 — `inheritance-law-article-badges` ·
      # `transfer-law-citation-link`도 함께 잡힌다(둘 다 법제처 API를 호출한다).
      - name: E2E 법제처 API spec (단독, 워커 1)
        run: npx playwright test law- --workers=1 --reporter=list,blob
        env:
          # 🔑 이 키가 이 job의 전제다. `.gitignore`가 `.env*`를 제외하므로
          # **fresh checkout에는 키가 없고**, `lib/korean-law/client-core.ts:48`의
          # `process.env.KOREAN_LAW_OC`가 빈 값이 되어 브라우저에 `TypeError: Failed to fetch`가 뜬다.
          #   ⇒ 2026-08-02 E2E 게이트 도입 후 **CI 6연속 실패**가 전부 이 원인이었다.
          #     로컬은 `.env.local`이 있어 통과하므로 "known-failures 0건"도 로컬 기준이었다.
          # 저장소 secret으로 주입한다(2026-08-03 등록).
          KOREAN_LAW_OC: ${{ secrets.KOREAN_LAW_OC }}

      - name: blob 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-law
          path: blob-report
          retention-days: 7

  # ── job 4: 리포트 병합 ──────────────────────────────────────────────────
  # 샤드 4개 + law job이면 리포트도 5조각이라 그대로는 읽기 어렵다. 하나의 HTML로 합쳐 올린다.
  # 실패한 job이 있어도 돈다(`!cancelled()`) — 실패 원인을 보려고 만드는 리포트다.
  e2e-report:
    name: E2E 리포트 병합
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    needs: [e2e, e2e-law]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (fresh)
        run: npm ci

      - name: 샤드 blob 내려받기
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: HTML 리포트로 병합
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: 병합 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
