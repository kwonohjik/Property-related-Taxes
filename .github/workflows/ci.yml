name: CI

# ══════════════════════════════════════════════════════════════════
# **GitHub 호스팅 러너**에서 실행한다 (2026-08-04 환원).
#
# ## 왜 돌아왔나 — 저장소가 public이 되어 전제가 뒤집혔다
#
# 2026-07-31에 self-hosted(개발자 Mac)로 옮긴 이유는 **비공개 저장소**의 무료 한도였다:
# 월 2,000분인데 변경 1건당 2회 × 10.4~14.4분이라 약 83건이면 소진했고, 소진 후에는
# 3~13초 만에 거부되어 과금도 신호도 없는 상태가 됐다(7월 실패 723건).
#
# 저장소가 public으로 전환되면서 두 가지가 동시에 바뀌었다:
#   1. **GitHub 호스팅 러너가 무료**다(public 저장소는 Actions 분을 쓰지 않는다) — 한도 문제 소멸.
#   2. **self-hosted가 오히려 위험**하다 — public에서는 fork PR이 개발자 Mac에서 임의 코드를
#      실행할 수 있다. GitHub이 명시적으로 권장하지 않는 조합이다.
#
# ⚠️ 저장소를 다시 비공개로 되돌리면 1번 근거가 사라진다. 그때는 사용량을 먼저 확인할 것.
#
# 부수 효과: Mac 전원과 무관하게 CI가 돈다(종전에는 러너가 꺼져 있으면 체크가 큐에 대기했다).
#
# ## 🔴 호스팅 러너는 Mac보다 훨씬 느리다 — job을 쪼개고 E2E를 샤딩하는 이유
#
# 환원 직후의 단일 job 구성은 **호스팅 러너에서 한 번도 완주하지 못했다**(3전 3패, 전부
# 타임아웃 취소 — PR #1056·#1058·#1059). 실측 분해(run 30962559594):
#
#   | 단계                    | 호스팅(ubuntu-latest) | self-hosted(Mac) |
#   |-------------------------|----------------------|------------------|
#   | npm ci·typecheck·lint   | 2.5분                | ~1.5분           |
#   | npm test (vitest)       | **18.7분**           | 3.1분            |
#   | E2E 894건               | **~29분**(2 worker)  | ~5분(5 worker)   |
#   | 합계                    | **~50분**            | 9~10분           |
#
# 원인은 코어 수다 — 호스팅 러너는 2 worker, Mac은 5 worker로 잡힌다. vitest·Playwright
# 둘 다 코어 수에 비례해 병렬도를 정하므로 그대로 몇 배가 된다.
#
# ⚠️ **"실측 10분"은 Mac 수치였다.** #1059가 그 값을 호스팅 실측으로 오인해 타임아웃을
#    25분으로 줄였고, 결과는 더 일찍 죽은 것뿐이었다. 아래 timeout은 **호스팅 러너
#    실측**으로만 갱신할 것 — 러너가 다르면 다른 숫자다.
#
# ⇒ 대응: **check(vitest)와 e2e를 별도 job으로 분리**해 벽시계를 병렬화하고,
#    가장 큰 덩어리인 E2E를 **4샤드**로 나눈다. 두 job은 서로 기다리지 않는다
#    (`needs` 없음) — public 저장소는 Actions 분이 무료라 벽시계가 유일한 비용이다.
#
# ## 🔴 2026-08-25 — 병목은 E2E가 아니라 vitest였다 (job 재분할)
#
# E2E를 6샤드로 나눈 뒤 **임계 경로가 `check` job으로 옮겨갔다**. 실측(run 32738876959):
# check 976초(16.3분) 중 **vitest가 862초(88%)**, E2E 최장 샤드는 476초(7.9분)였다.
#
# 원인 둘을 실측으로 갈랐다:
#   1. **전역 jsdom** — `vitest.config.ts`가 순수 함수 엔진 테스트까지 jsdom을 세웠다.
#      전건 1482파일 CPU 1811초 중 **environment가 545초(30%)** 였고, 실제 테스트 실행은
#      89초였다. `.test.tsx` = jsdom / `.test.ts` = node로 가르니 **CPU −28%**(1811→1305초).
#      DOM이 실제로 필요한 파일은 전건의 10%뿐이었다(근거는 vitest.config.ts 주석).
#   2. **샤딩 부재** — E2E만 나뉘어 있었다. `--shard=N/4`가 CPU를 정확히 1/4로 가른다.
#
# ⇒ `check`(typecheck+lint) / `test`(vitest 4샤드) / `e2e`(6샤드)의 3-job 구성으로 바꿨다.
#   임계 경로는 **E2E 7.9분 + 리포트 0.8분 ≈ 8.7분**으로 옮겨간다(종전 16.3분).
#
# ✅ **샤드 커버리지 실측 검증**: 4샤드 합집합 1488파일 = 디스크 1488파일, 샤드 간 중복 0,
#    누락 0(json 리포터로 파일 집합 대조). 「조용한 미실행」이 없음을 확인했다.
#
# ## 역할 분담 — pre-push와 중복되지 않게
#
#   · **pre-push**(매 푸시, 빠름): 폰트·톤 + typecheck + lint + **범위 선택** 테스트
#     → `scripts/select-test-scope.sh`로 변경 경로에 맞는 세목만
#   · **CI**(PR 1회, 철저): fresh checkout + `npm ci` + typecheck + lint + **전체** 테스트(4샤드) + E2E
#     → 러너가 매번 깨끗한 환경이라 로컬 node_modules가 가리던 lockfile·의존성 문제가
#       드러난다. 로컬 pre-push가 못 주는 신호가 이것이라 CI는 **전체 테스트**를 돌린다
#       (범위를 좁히면 pre-push의 재탕이 된다).
#
# 문서 전용·draft PR은 건너뛴다(대기시간).
# ══════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"

# 같은 PR에 연속 푸시하면 이전 실행을 취소한다 — 낡은 커밋의 결과를 기다리지 않는다.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── job 1: 타입 · 린트 ──────────────────────────────────────────────────
  #
  # 🔴 **vitest를 여기서 떼어냈다** (2026-08-25). 종전엔 typecheck·lint·test가 한 job에
  #    직렬로 붙어 있었고, 실측(run 32738876959) 976초 중 **vitest가 862초(88%)** 였다.
  #    E2E는 이미 6샤딩으로 8분 이하라 **전체 벽시계 16.3분을 이 job 하나가 결정**했다.
  #
  #      | 단계      | 소요 |
  #      |-----------|------|
  #      | npm ci    | 17s  |
  #      | typecheck | 22s  |
  #      | lint      | 59s  |
  #      | **vitest**| **862s** |
  #
  #    ⇒ typecheck·lint(81초)를 별도 job으로 남기고 vitest는 아래 `test` job에서 샤딩한다.
  #      둘은 서로 기다리지 않는다 — public 저장소는 Actions 분이 무료라 벽시계가 유일한 비용이다.
  check:
    name: typecheck + lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 개발 환경과 메이저를 맞춘다(로컬 v24). 호스팅 러너 기본 Node는 이보다 낮을 수 있어
      # 명시하지 않으면 로컬에서 통과한 코드가 여기서만 깨질 수 있다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Node 버전 확인
        run: node -v && npm -v

      # `npm ci`는 node_modules를 지우고 lockfile 그대로 재설치한다 —
      # 로컬 개발 트리가 가리던 의존성·lockfile 문제를 드러내는 CI 고유 신호다.
      - name: Install deps (fresh)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ── job 2: 단위 테스트 (4샤드 병렬) ─────────────────────────────────────
  #
  # pre-push는 범위 선택 테스트만 돌린다(`scripts/select-test-scope.sh`) → CI는 전체를 돌려
  # 그 갭을 메운다. 범위를 좁히면 pre-push의 재탕이 되므로 **좁히지 않고 샤딩으로** 줄인다.
  #
  # 실측(2026-08-25, 로컬 전건 1482파일): `--shard=1/4`가 CPU 1305초의 정확히 1/4인 328초를
  # 가져갔다 — 파일 단위 균등 분할이 잘 먹는다. CI 2 worker 기준 샤드당 ~155초 + 준비 ~28초.
  #
  # ⚠️ **샤드 수를 바꾸면 아래 `--shard=N/4`의 분모도 함께** 바꿔야 한다. 어긋나면 일부
  #    테스트가 어느 샤드에도 안 들어가 **조용히 실행되지 않는다**(E2E와 같은 함정).
  test:
    name: test (${{ matrix.shard }}/4)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 한 샤드가 깨져도 나머지를 끝까지 돌린다 — 실패가 한 샤드에 몰렸는지 전반적인지가
      # 원인 판단을 가른다.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (fresh)
        run: npm ci

      - name: Test 샤드 ${{ matrix.shard }}/4 (전체 중)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # ── job 2: E2E (4샤드 병렬) ─────────────────────────────────────────────
  #
  # **E2E는 종전에 어느 자동 게이트에도 없었다.** pre-push도 CI도 vitest만 돌렸다.
  # 그래서 PR#1008이 `gift-deemed-capital-increase.spec.ts`를 조용히 무력화시킨 것을
  # 다음 작업에서야 발견했다(`toContainText("0")`이 substring이라 "300,000,000"도 통과).
  #
  # pre-push에는 넣지 않는다 — 매 푸시에 붙으면 개발 흐름이 끊긴다. PR 1회만 돌린다.
  #
  # `check`를 기다리지 않는다(`needs` 없음) — 병렬이라야 벽시계가 줄고, public 저장소는
  # Actions 분이 무료라 "typecheck가 깨졌을 때 낭비되는 E2E 분"이 비용이 아니다.
  e2e:
    name: E2E (${{ matrix.shard }}/6)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # 실측 역산: 894건을 2 worker로 전건 ~29분 → 4샤드면 샤드당 ~7분 + 준비 2분 ≈ 9분.
    # ⚠️ 이 값은 **취소된 실행에서 역산한 추정**이다. 첫 완주 후 실측으로 교체할 것.
    #
    # 🔴 **4→6 샤드 (2026-08-08).** 4샤드 구성에서 **샤드 3이 25분 타임아웃으로 반복 실패**했다
    #    (#1139·#1140 각각, 재실행 포함 3회). 죽은 원인이 job 타임아웃이라 Playwright가 실패
    #    요약을 출력하지도 `e2e-blob-3`을 업로드하지도 못해 **오류 메시지 자체가 남지 않았다** —
    #    원인 규명이 막힌 지점이 그것이다.
    #    같은 샤드를 로컬에서 fresh 서버 + `CI=1` + 2 worker로 돌리면 전건 통과한다(17.5초).
    #    ⇒ 샤드당 부하를 낮춰 완주시키고, 그래도 실패하면 **실제 오류와 trace**를 얻는다.
    #    public 저장소라 Actions 분은 무료이므로 비용은 벽시계뿐이고, 샤드가 늘면 오히려 준다.
    timeout-minutes: 25
    strategy:
      # 한 샤드가 깨져도 나머지를 끝까지 돌린다 — 실패가 한 샤드에 몰렸는지 전반적인지가
      # 원인 판단을 가른다. fail-fast면 그 구분이 사라진다.
      fail-fast: false
      matrix:
        # ⚠️ 샤드 수를 바꾸면 아래 `--shard=N/6`의 분모도 함께 바꿔야 한다.
        #    어긋나면 일부 테스트가 어느 샤드에도 안 들어가 **조용히 실행되지 않는다**.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (fresh)
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # ⚠️ `known-failures 제외` 전제가 이 step을 의미 있게 만든다 — master에도 실패하는
      #    건들을 그대로 두면 CI가 상시 빨간불이 되어 게이트 구실을 못 한다
      #    (`e2e/known-failures.ts`). 목록은 **줄이기만** 한다.
      # ⚠️ 호스팅 러너는 Linux다. Mac 기준으로 쌓인 known-failures와 어긋나 렌더 차이로
      #    새 실패가 나올 수 있다 — 그때는 원인을 확인하고 고친다(목록에 추가하지 말 것).
      #
      # 샤딩은 `grepInvert`(known-failures) **적용 후**의 집합을 나눈다 — 제외 대상이
      # 한 샤드에 몰려 불균형해지지 않는다.
      #
      # `blob` 리포터는 샤드별 부분 결과를 낸다 — 아래 `e2e-report` job이 HTML 하나로 합친다.
      # (config의 html 리포터를 CLI로 덮어쓴다. 샤드마다 별도 HTML을 내면 합칠 수 없다.)
      - name: E2E 샤드 ${{ matrix.shard }}/6 (알려진 사전존재 실패 제외)
        run: npx playwright test --shard=${{ matrix.shard }}/6 --reporter=list,blob
        env:
          # 🔑 `e2e/law-*.spec.ts` 16 spec 중 **조문 본문을 단언하는 5건**
          # (POPUP-1·HTML-1·TBL-1·CITE-1·IMP-1)은 2026-08-06부터 **fixture mock**이라
          # 이 키 없이도 결정적이다(`e2e/_helpers/law-api-mock.ts`). 나머지 11건은 여전히
          # 실호출이지만 제목·라우팅만 단언해 API 없이도 통과한다.
          #
          # **그래도 키는 유지한다** — `.gitignore`가 `.env*`를 제외해 fresh checkout에는 키가
          # 없고, `lib/korean-law/client-core.ts:48`의 `process.env.KOREAN_LAW_OC`가 빈 값이면
          # 브라우저에 `TypeError: Failed to fetch`가 뜬다. 2026-08-02 게이트 도입 후
          # **CI 6연속 실패**가 전부 이 원인이었다(로컬은 `.env.local`이 있어 통과했다).
          # 저장소 secret으로 주입한다(2026-08-03 등록).
          KOREAN_LAW_OC: ${{ secrets.KOREAN_LAW_OC }}

      - name: blob 리포트 업로드
        # 실패해도 올린다 — 실패했을 때가 리포트가 필요한 때다.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # ── job 3: 리포트 병합 ──────────────────────────────────────────────────
  # 샤드가 4개면 리포트도 4조각이라 그대로는 읽기 어렵다. 하나의 HTML로 합쳐 올린다.
  # 실패한 job이 있어도 돈다(`!cancelled()`) — 실패 원인을 보려고 만드는 리포트다.
  #
  # 📌 종전 `e2e-law` job(법제처 실호출)은 2026-08-06에 **제거**했다. 러너 IP 종속 33% 실패로
  #    상시 빨간불이었고(48회 전수: success 32 · failure 16), 본문 단언 5건을 fixture mock으로
  #    돌려 샤드에 합쳤다. 가용성 감시는 `law-api-health.yml`(주간 스케줄)이 이어받는다.
  e2e-report:
    name: E2E 리포트 병합
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (fresh)
        run: npm ci

      - name: 샤드 blob 내려받기
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: HTML 리포트로 병합
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: 병합 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
