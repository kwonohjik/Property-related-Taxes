name: Supabase Migration Audit

# supabase/migrations/**.sql 의 「최종 상태」가 실제 DB에 반영돼 있는지 검사한다.
#
# 왜: 이 저장소는 supabase/config.toml 이 없어 `supabase db push` 경로가 아니고,
# 마이그레이션을 SQL Editor에서 손으로 적용해 왔다. 그래서 2026-05-18 이후 추가된
# **3건이 약 3개월간 누락**돼 있었다(2026-08-28 발견). 앱이 읽는 테이블은 tax_rates
# 하나뿐이라 계산은 멀쩡했고, 그래서 아무도 눈치채지 못했다.
#
# 검사 내용은 scripts/verify-supabase-migrations.mjs 참조. 의존성이 없어 `npm ci` 불필요.
#
# 사전 설정 (repo Settings → Secrets and variables → Actions):
#   - NEXT_PUBLIC_SUPABASE_URL       (필수)
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY  (필수)
#   - SUPABASE_SERVICE_ROLE_KEY      (선택 — 있으면 CHECK 제약까지 검증한다.
#                                     없으면 그 1개 검사만 건너뛰고 나머지는 그대로 돈다)
#   URL·ANON이 없으면 graceful skip (실패 아님) — keepalive와 같은 정책.

on:
  schedule:
    # 매주 월요일 01:37 UTC (정시 혼잡 회피 오프셋)
    - cron: "37 1 * * 1"
  # 마이그레이션을 머지한 직후에도 확인 — 주간 스케줄까지 기다리지 않는다.
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - "scripts/verify-supabase-migrations.mjs"
      - ".github/workflows/supabase-migration-audit.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 트리거 사유"
        required: false
        default: "manual"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 마이그레이션 적용 여부 검증
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice::Supabase secrets 미설정 — 마이그레이션 검증 skip"
            exit 0
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY 미설정 — CHECK 제약 검증만 건너뛴다(부분 검증)."
          fi
          node scripts/verify-supabase-migrations.mjs
